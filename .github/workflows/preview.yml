name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola implementación a la vez; no cancela las en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox

      # TeX Live mínimo sin acciones de terceros (la política del repo las
      # bloquea): instalador oficial + tlmgr con solo los paquetes necesarios,
      # cacheado entre ejecuciones.
      - name: Caché de TeX Live
        id: texlive-cache
        uses: actions/cache@v4
        with:
          path: ~/texlive
          key: texlive-2025-${{ hashFiles('.github/texlive-packages.txt') }}

      - name: Instalar TeX Live mínimo
        if: steps.texlive-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          curl -sSL https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz | tar xz
          cd install-tl-*
          cat > profile.txt <<EOF
          selected_scheme scheme-infraonly
          TEXDIR $HOME/texlive
          TEXMFCONFIG $HOME/texlive/texmf-config
          TEXMFVAR $HOME/texlive/texmf-var
          TEXMFHOME $HOME/texmf
          TEXMFLOCAL $HOME/texlive/texmf-local
          TEXMFSYSCONFIG $HOME/texlive/texmf-config
          TEXMFSYSVAR $HOME/texlive/texmf-var
          tlpdbopt_install_docfiles 0
          tlpdbopt_install_srcfiles 0
          tlpdbopt_autobackup 0
          EOF
          ./install-tl --profile=profile.txt --no-interaction
          export PATH="$HOME/texlive/bin/x86_64-linux:$PATH"
          tlmgr install $(grep -v '^#' "$GITHUB_WORKSPACE/.github/texlive-packages.txt" | tr '\n' ' ')

      - name: Añadir TeX Live al PATH
        run: echo "$HOME/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"

      - name: Compilar los dosieres PDF
        run: make pdf-docs

      - name: Build site with /csd-preview prefix
        env:
          CSD_BASE_URL: /csd-preview
        run: make build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
