name: Deploy to production (SFTP)

# Despliegue MANUAL a la web oficial (Arsys). Nunca se ejecuta solo.
# Por defecto solo COMPRUEBA el acceso (lista la carpeta remota, no sube nada).
# Para publicar de verdad: modo = publicar y confirmar = PUBLICAR.
# Nada debe publicarse hasta que la Junta dé el visto bueno.
#
# Estado (25-09-2026): usuario SFTP = ciudadsantodomingo.org (el que da
# Arsys; csd@csdomingo.com ya no entra ni desde casa). Con ese usuario y la
# misma contraseña que funciona desde casa (huella verificada), Arsys sigue
# respondiendo «Permission denied» a las máquinas de GitHub, aunque su
# soporte dice que la IP no está bloqueada. El modo comprobar imprime IP,
# fecha y hora del intento y el diálogo de autenticación (-v) para
# enviárselo.
#
# El modo comprobar NO compila nada (solo instala lftp/sshpass y prueba el
# acceso); la compilación de PDF y web se hace solo en modo publicar.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "comprobar = solo listar la carpeta remota; publicar = subir la web"
        type: choice
        default: comprobar
        options: [comprobar, publicar]
      confirmar:
        description: "Escriba PUBLICAR para autorizar la subida (solo en modo publicar)"
        type: string
        default: ""

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  sftp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar la confirmación
        if: inputs.modo == 'publicar' && inputs.confirmar != 'PUBLICAR'
        run: |
          echo "::error::Modo publicar sin la confirmación PUBLICAR. No se hace nada."
          exit 1

      - name: Instalar Emacs y lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox lftp sshpass

      - name: Registrar la clave SSH del servidor
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -t ed25519,rsa "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts

      - name: Comprobar acceso SFTP (solo lectura)
        if: inputs.modo == 'comprobar'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -o pipefail
          echo "Longitudes (no se imprimen valores): host ${#SFTP_HOST}, usuario ${#SFTP_USER}, contraseña ${#SSHPASS}, ruta ${#SFTP_REMOTE_PATH}"
          # Datos que pide el soporte de Arsys para localizar el intento en sus registros.
          IP=$(curl -fsS --max-time 10 https://api.ipify.org || curl -fsS --max-time 10 https://ifconfig.me/ip || echo "desconocida")
          echo "== Datos del intento para Arsys =="
          echo "IP pública del runner : $IP"
          echo "Servidor destino      : $SFTP_HOST ($(getent hosts "$SFTP_HOST" | awk '{print $1}' | head -1)) puerto 22"
          echo "Fecha y hora (UTC)    : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Fecha y hora (Madrid) : $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "== Prueba: sftp de OpenSSH con sshpass =="
          printf 'ls -l %s\n' "$SFTP_REMOTE_PATH" | sshpass -e sftp -v -o StrictHostKeyChecking=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no -b - "$SFTP_USER@$SFTP_HOST" 2>&1 | grep -v -E 'debug1: (Reading|Connecting|Connection established|identity file|Local version|Remote protocol|compat|Authenticating|SSH2_MSG|kex|expecting|rekey|Host .* is known|Found key|Will attempt|Server host key|load_hostkeys|hostkeys|Sending|Entering|pledge|client_input|Remote: |Requesting|Sending subsystem|channel|Exit status)'
          echo "Acceso correcto a las $(TZ=Europe/Madrid date '+%H:%M:%S %Z'). No se ha subido nada."

      # TeX Live mínimo sin acciones de terceros (setup-texlive-action fallaba
      # con «Repository access blocked»): instalador oficial + tlmgr con solo
      # los paquetes necesarios, cacheado entre ejecuciones.
      - name: Caché de TeX Live
        id: texlive-cache
        if: inputs.modo == 'publicar'
        uses: actions/cache@v4
        with:
          path: ~/texlive
          key: texlive-2025-${{ hashFiles('.github/texlive-packages.txt') }}

      - name: Instalar TeX Live mínimo
        if: inputs.modo == 'publicar' && steps.texlive-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          curl -sSL https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz | tar xz
          cd install-tl-*
          cat > profile.txt <<EOF
          selected_scheme scheme-infraonly
          TEXDIR $HOME/texlive
          TEXMFCONFIG $HOME/texlive/texmf-config
          TEXMFVAR $HOME/texlive/texmf-var
          TEXMFHOME $HOME/texmf
          TEXMFLOCAL $HOME/texlive/texmf-local
          TEXMFSYSCONFIG $HOME/texlive/texmf-config
          TEXMFSYSVAR $HOME/texlive/texmf-var
          tlpdbopt_install_docfiles 0
          tlpdbopt_install_srcfiles 0
          tlpdbopt_autobackup 0
          EOF
          ./install-tl --profile=profile.txt --no-interaction
          export PATH="$HOME/texlive/bin/x86_64-linux:$PATH"
          tlmgr install $(grep -v '^#' "$GITHUB_WORKSPACE/.github/texlive-packages.txt" | tr '\n' ' ')

      - name: Añadir TeX Live al PATH
        if: inputs.modo == 'publicar'
        run: echo "$HOME/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"

      - name: Compilar los dosieres PDF
        if: inputs.modo == 'publicar'
        run: |
          if ! make pdf-docs; then
            echo "::group::Errores de LaTeX"
            grep -h -A6 '^!' pdf/build/*.log | head -80 || true
            echo "::endgroup::"
            echo "::group::Últimas líneas de los .log"
            tail -n 40 pdf/build/*.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Construir el sitio (producción, URLs sin prefijo)
        if: inputs.modo == 'publicar'
        env:
          CSD_BASE_URL: ""
        run: make build

      - name: Publicar por SFTP
        if: inputs.modo == 'publicar' && inputs.confirmar == 'PUBLICAR'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          lftp -u "$SFTP_USER",x sftp://"$SFTP_HOST" <<LFTP
            set sftp:connect-program "sshpass -e ssh -a -x -o StrictHostKeyChecking=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no"
            set net:max-retries 3
            set net:timeout 60
            mirror --reverse --delete --verbose ./public/ "$SFTP_REMOTE_PATH"
          LFTP
          echo "Despliegue completado."
