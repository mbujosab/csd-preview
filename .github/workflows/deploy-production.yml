name: Deploy to production (SFTP)

# Despliegue MANUAL a la web oficial (Arsys). Nunca se ejecuta solo.
# Por defecto solo COMPRUEBA el acceso (lista la carpeta remota, no sube nada).
# Para publicar de verdad: modo = publicar y confirmar = PUBLICAR.
# Nada debe publicarse hasta que la Junta dé el visto bueno.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "comprobar = solo listar la carpeta remota; publicar = subir la web"
        type: choice
        default: comprobar
        options: [comprobar, publicar]
      confirmar:
        description: "Escriba PUBLICAR para autorizar la subida (solo en modo publicar)"
        type: string
        default: ""

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  sftp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar la confirmación
        if: inputs.modo == 'publicar' && inputs.confirmar != 'PUBLICAR'
        run: |
          echo "::error::Modo publicar sin la confirmación PUBLICAR. No se hace nada."
          exit 1

      - name: Instalar Emacs y lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox lftp

      # TeX Live mínimo sin acciones de terceros (setup-texlive-action fallaba
      # con «Repository access blocked»): instalador oficial + tlmgr con solo
      # los paquetes necesarios, cacheado entre ejecuciones.
      - name: Caché de TeX Live
        id: texlive-cache
        uses: actions/cache@v4
        with:
          path: ~/texlive
          key: texlive-2025-${{ hashFiles('.github/texlive-packages.txt') }}

      - name: Instalar TeX Live mínimo
        if: steps.texlive-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          curl -sSL https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz | tar xz
          cd install-tl-*
          cat > profile.txt <<EOF
          selected_scheme scheme-infraonly
          TEXDIR $HOME/texlive
          TEXMFCONFIG $HOME/texlive/texmf-config
          TEXMFVAR $HOME/texlive/texmf-var
          TEXMFHOME $HOME/texmf
          TEXMFLOCAL $HOME/texlive/texmf-local
          TEXMFSYSCONFIG $HOME/texlive/texmf-config
          TEXMFSYSVAR $HOME/texlive/texmf-var
          tlpdbopt_install_docfiles 0
          tlpdbopt_install_srcfiles 0
          tlpdbopt_autobackup 0
          EOF
          ./install-tl --profile=profile.txt --no-interaction
          export PATH="$HOME/texlive/bin/x86_64-linux:$PATH"
          tlmgr install $(grep -v '^#' "$GITHUB_WORKSPACE/.github/texlive-packages.txt" | tr '\n' ' ')

      - name: Añadir TeX Live al PATH
        run: echo "$HOME/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"

      - name: Compilar los dosieres PDF
        run: |
          if ! make pdf-docs; then
            echo "::group::Errores de LaTeX"
            grep -h -A6 '^!' pdf/build/*.log | head -80 || true
            echo "::endgroup::"
            echo "::group::Últimas líneas de los .log"
            tail -n 40 pdf/build/*.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Construir el sitio (producción, URLs sin prefijo)
        env:
          CSD_BASE_URL: ""
        run: make build

      - name: Registrar la clave SSH del servidor
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -t ed25519,rsa "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts

      - name: Comprobar acceso SFTP (solo lectura)
        if: inputs.modo == 'comprobar'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" sftp://"$SFTP_HOST" <<LFTP
            set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes"
            set net:max-retries 2
            set net:timeout 30
            cls -l "$SFTP_REMOTE_PATH"
          LFTP
          echo "Acceso correcto. No se ha subido nada."

      - name: Publicar por SFTP
        if: inputs.modo == 'publicar' && inputs.confirmar == 'PUBLICAR'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" sftp://"$SFTP_HOST" <<LFTP
            set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes"
            set net:max-retries 3
            set net:timeout 60
            mirror --reverse --delete --verbose ./public/ "$SFTP_REMOTE_PATH"
          LFTP
          echo "Despliegue completado."
