name: Deploy to production (FTP)

on:
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox

      - name: Build site (produccion)
        env:
          CSD_BASE_URL: ""
        run: make build

      - name: Install lftp
        run: sudo apt-get install -y --no-install-recommends lftp

      - name: Deploy via FTP
        env:
          FTP_HOST:        ${{ secrets.SFTP_HOST }}
          FTP_USER:        ${{ secrets.SFTP_USER }}
          FTP_PASSWORD:    ${{ secrets.SFTP_PASSWORD }}
          FTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" ftp://"$FTP_HOST" <<LFTP
            set ftp:ssl-allow no
            set net:max-retries 3
            mirror --reverse --delete --verbose ./public/ $FTP_REMOTE_PATH
          LFTP
