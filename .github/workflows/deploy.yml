name: Deploy to production (SFTP)

# Solo se ejecuta manualmente desde la pestaña Actions de GitHub.
# Antes de usarlo, crea estos Secrets en:
#   Settings → Secrets and variables → Actions → Secrets
#
#   SFTP_HOST        →  ciudadsantodomingo.org
#   SFTP_USER        →  csd@csdomingo.com
#   SFTP_PASSWORD    →  tu contraseña
#   SFTP_REMOTE_PATH →  ruta raíz del sitio en el servidor, p.ej. /public_html/

on:
  workflow_dispatch:

jobs:
  sftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox

      - name: Build site (producción: BASE_URL vacío, sirve en raíz)
        env:
          CSD_BASE_URL: ""
        run: make build

      - name: Install lftp
        run: sudo apt-get install -y --no-install-recommends lftp

      - name: Deploy via SFTP
        env:
          SFTP_HOST:        ${{ secrets.SFTP_HOST }}
          SFTP_USER:        ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD:    ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" sftp://"$SFTP_HOST" <<EOF
            set sftp:auto-confirm yes
            set net:max-retries 3
            mirror --reverse --delete --verbose \
              ./public/ $SFTP_REMOTE_PATH
          EOF

